<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte interactive</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <p>Taux de chômage administratif en Wallonie</p>
    </header>
    <div class="container">
    <div id="parameters">
        <fieldset>
<legend>Sélectionner un type d'entité :</legend>
            <input type="radio" name="entite" id="Province" value="Province" checked/>
            <label for="Province">Province</label><br>
            <input type="radio" name="entite" id="Arrondissement" value="Arrondissement" />
            <label for="Arrondissement">Arrondissement</label><br>
            <input type="radio" name="entite" id="Commune" value="Commune" />
            <label for="Commune">Commune</label>
        </fieldset>
        <fieldset>
            <legend>Taux</legend>
            <p><img src="assets/arrow-up.svg" alt=""><span id="entity-max"></span></p>
            <p><img src="assets/arrow-down.svg" alt=""><span id="entity-min"></span></p>
            
        </fieldset>

    </div>
        <div id="map">

        </div>

                    </tr>
                </thead>
                <tbody id="table_body_rank">

                </tbody>
            </table>
        </div> -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

    crossorigin=""></script>
    <script type="module" src="tableData.js"></script>
    <script type="module" src="map.mjs"></script>
</body>
</html>
